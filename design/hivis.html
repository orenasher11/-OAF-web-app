<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="../icon.svg">
<title>Hi-Vis design</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="hivis.css">
</head>
<body class="hivis">
<div class="app">
  <header class="top">
    <a class="switch" href="./">‹ Designs</a>
    <h1 id="h1"></h1>
    <div class="sub" id="sub"></div>
    <section class="stats" id="stats" hidden></section>
  </header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Add task">+</button>
<div class="toast" id="toast"></div>
<nav>
  <button data-view="today" class="active"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/><circle cx="12" cy="12" r="9.5"/></svg><span>Today</span></button>
  <button data-view="upcoming"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Upcoming</span></button>
  <button data-view="projects"><svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 012-2h4l2 2.5h7a2 2 0 012 2v8a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg><span>Projects</span></button>
</nav>
<div class="sheet-bg" id="bg">
  <div class="sheet" role="dialog">
    <div class="grab"></div>
    <h2 id="sheetTitle">New task</h2>
    <label for="f-title">What needs to be done?</label>
    <input id="f-title" placeholder="e.g. Call plumber about rough-in" autocomplete="off">
    <label>Type</label>
    <div class="chips" id="catChips"></div>
    <label for="f-project">Project / customer</label>
    <input id="f-project" list="projList" placeholder="e.g. Martinez kitchen" autocomplete="off">
    <datalist id="projList"></datalist>
    <label>Due</label>
    <div class="chips" id="dueChips">
      <button type="button" class="chip" data-d="0">Today</button>
      <button type="button" class="chip" data-d="1">Tomorrow</button>
      <button type="button" class="chip" data-d="2">In 2 days</button>
      <button type="button" class="chip" data-d="7">Next week</button>
    </div>
    <input type="date" id="f-due" class="dateinput">
    <div class="chips"><button type="button" class="chip" id="starChip">☆ Priority</button></div>
    <label for="f-notes">Notes (optional)</label>
    <textarea id="f-notes" placeholder="Phone number, details, amounts..."></textarea>
    <div class="actions">
      <button class="btn danger" id="delBtn" hidden>Delete</button>
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
